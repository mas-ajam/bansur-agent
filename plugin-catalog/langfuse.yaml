name: langfuse
repo: https://github.com/bansur/bansur-official-plugins
sha: c2a95963c442f3f23e4bc6fe0da898e1dd1fb63d
subdir: langfuse
description: 'Langfuse observability for Bansur: one trace per turn, one generation per LLM call (usage
  and cost from Bansur'' own pricing, cache and reasoning tokens included), one observation per tool
  call and subagent. Content capture is sanitized by default (metadata-only and full are opt-in); sends
  traces only to the Langfuse project whose keys you set. Formerly built into Bansur core as
  observability/langfuse; existing users are migrated automatically.'
maintainer: bansur
tier: official
category: general
requires_bansur: ">=0.21.7"
version: "2.0.0"
image: https://raw.githubusercontent.com/bansur/bansur-official-plugins/c2a95963c442f3f23e4bc6fe0da898e1dd1fb63d/assets/langfuse.jpg
docs_url: https://github.com/bansur/bansur-official-plugins/tree/main/langfuse
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_api_request
    - post_api_request
    - api_request_error
    - pre_llm_call
    - post_llm_call
    - pre_tool_call
    - post_tool_call
    - on_session_finalize
    - on_session_end
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env:
    - BANSUR_LANGFUSE_PUBLIC_KEY
    - BANSUR_LANGFUSE_SECRET_KEY
