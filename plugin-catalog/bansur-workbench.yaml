description: The Bansur desktop app in your browser. `bansur workbench` serves the desktop interface through the Bansur dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Bansur product. On the first `bansur workbench` run and again after each Bansur update it runs `npm install --ignore-scripts` (guided by Bansur's lockfile) and Vite against your Bansur checkout's desktop sources, writing only under ~/.bansur/bansur-workbench and its own plugin dir (the checkout is only read), and starts `bansur dashboard` on loopback when none is running.
maintainer: sxuff
